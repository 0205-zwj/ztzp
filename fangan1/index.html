<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>中铁装配 钢结构构件信息</title>
  <!-- model-viewer 依赖，保留你原来的CDN -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --ease-ios: cubic-bezier(0.25, 0.1, 0.25, 1); /* iOS原生动效曲线 */
      --glass-blur: 8px;
      --glass-bright: brightness(1.04);
      --transition-normal: 0.32s var(--ease-ios);
      --transition-quick: 0.24s var(--ease-ios);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 去掉移动端点击灰块 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7fafc;
      color: #222;
      overflow-x: hidden;
    }
    /* 页面外层容器，原始布局不动 */
    .page-wrap {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
    }
    /* 3D模型容器【核心：全屏过渡优化，解决黑屏闪】 */
    .model-box {
      width: 100%;
      min-height: 520px;
      border-radius: 24px;
      background: #edf4fb;
      position: relative;
      overflow: hidden;
      /* 只给transform和opacity开过渡，其余属性不参与动画 */
      transition: transform var(--transition-normal), opacity var(--transition-normal);
      will-change: transform, opacity;
    }
    /* 全屏状态类：只缩放位移，不重绘页面结构 */
    .model-box.fullscreen-mode {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      z-index: 999;
    }
    /* 加载遮罩层 */
    .loading-layer {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #edf4fb;
      z-index: 2;
      transition: opacity var(--transition-normal);
    }
    .loading-layer.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .loading-spinner {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(110,160,220,0.2);
      border-top-color: #4285d4;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 22px;
      color: #2b5b99;
      font-weight: 500;
    }
    .loading-subtext {
      font-size: 15px;
      color: #7a97b8;
      margin: 8px 0 12px;
    }
    .loading-percent {
      font-size: 48px;
      color: #2b5b99;
      font-weight: 600;
    }
    /* 右侧悬浮按钮组 */
    .model-side-buttons {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 3;
    }
    .side-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.72);
      backdrop-filter: var(--glass-blur) var(--glass-bright);
      -webkit-backdrop-filter: var(--glass-blur) var(--glass-bright);
      border: 1px solid rgba(255,255,255,0.85);
      box-shadow: 0 4px 14px rgba(30, 70, 130, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      /* 只过渡transform，阴影不参与动画 */
      transition: transform var(--transition-quick);
    }
    .side-btn:active {
      transform: scale(0.92);
    }
    /* 构件信息卡片 */
    .info-card {
      margin-top: 16px;
      width: 100%;
      border-radius: 20px;
      background: rgba(255,255,255,0.75);
      backdrop-filter: var(--glass-blur) var(--glass-bright);
      -webkit-backdrop-filter: var(--glass-blur) var(--glass-bright);
      padding: 20px;
      box-shadow: 0 3px 12px rgba(25,60,110,0.06);
      transition: transform var(--transition-normal), opacity var(--transition-normal);
    }
    .info-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .info-card-title {
      font-size: 22px;
      font-weight: 600;
      color: #203858;
    }
    .info-card-actions > button {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.7);
      transition: transform var(--transition-quick);
    }
    .info-card-actions > button:active {
      transform: scale(0.9);
    }
    .info-row {
      display: flex;
      padding: 14px 0;
      border-bottom: 1px solid rgba(180,200,225,0.25);
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      width: 120px;
      font-size: 17px;
      color: #627894;
    }
    .info-value {
      flex: 1;
      font-size:17px;
      color:#223652;
    }
    /* model-viewer 样式，关闭阴影减少性能开销 */
    model-viewer {
      width: 100%;
      height: 100%;
      position: absolute;
      inset:0;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <!-- 3D模型容器 -->
    <div class="model-box" id="modelContainer">
      <model-viewer
        id="modelViewer"
        src="你的模型.glb"
        alt="钢结构构件"
        shadow-intensity="0"
        auto-rotate
        camera-controls
        touch-action="none"
      ></model-viewer>

      <!-- 加载层 -->
      <div class="loading-layer" id="loadingLayer">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在加载3D模型</div>
        <div class="loading-subtext">正在下载模型数据...</div>
        <div class="loading-percent" id="percentText">0%</div>
      </div>

      <!-- 右侧工具栏 -->
      <div class="model-side-buttons">
        <button class="side-btn" id="btnReset">🔄</button>
        <button class="side-btn" id="btnHand">✋</button>
        <button class="side-btn" id="btn360">360</button>
        <button class="side-btn" id="btnTarget">🎯</button>
        <button class="side-btn" id="btnFullscreen">⛶</button>
        <button class="side-btn" id="btnScreen">🖥️</button>
        <button class="side-btn" id="btnSwitch">🔀</button>
        <button class="side-btn" id="btnCapture">📷</button>
      </div>
    </div>

    <!-- 构件信息卡片 -->
    <div class="info-card">
      <div class="info-card-header">
        <h2 class="info-card-title">构件基本信息</h2>
        <div class="info-card-actions">
          <button></button>
          <button></button>
          <button></button>
        </div>
      </div>
      <div class="info-row">
        <div class="info-label">构件编号</div>
        <div class="info-value">-</div>
      </div>
      <div class="info-row">
        <div class="info-label">加工号</div>
        <div class="info-value">-</div>
      </div>
      <div class="info-row">
        <div class="info-label">项目名称</div>
        <div class="info-value">-</div>
      </div>
    </div>
  </div>

  <script>
    // 获取DOM元素
    const modelContainer = document.getElementById('modelContainer');
    const loadingLayer = document.getElementById('loadingLayer');
    const percentText = document.getElementById('percentText');
    const modelViewer = document.getElementById('modelViewer');
    const btnFullscreen = document.getElementById('btnFullscreen');

    // ========== 模型加载进度逻辑（原样保留，优化动画） ==========
    modelViewer.addEventListener('progress', (e) => {
      const progress = Math.round(e.detail.totalProgress * 100);
      percentText.textContent = `${progress}%`;
      if(progress >= 100){
        // 加载完成平滑淡出加载层
        loadingLayer.classList.add('fade-out');
        setTimeout(()=>{
          loadingLayer.style.display = 'none';
        },320);
      }
    });

    // ========== 全屏逻辑【重点修复：消除黑屏闪烁，iOS式平滑过渡】 ==========
    let isFull = false;
    let transitioning = false;
    btnFullscreen.addEventListener('click', async ()=>{
      if(transitioning) return;
      transitioning = true;
      if(!isFull){
        // 进入全屏：先加class做CSS过渡，再调用原生全屏API
        modelContainer.classList.add('fullscreen-mode');
        await new Promise(resolve => setTimeout(resolve, 320));
        if(modelContainer.requestFullscreen){
          await modelContainer.requestFullscreen();
        }else if(modelContainer.webkitRequestFullscreen){
          await modelContainer.webkitRequestFullscreen();
        }
        isFull = true;
      }else{
        // 退出全屏：先退出原生全屏，再移除class做动画
        if(document.exitFullscreen){
          await document.exitFullscreen();
        }else if(document.webkitExitFullscreen){
          await document.webkitExitFullscreen();
        }
        modelContainer.classList.remove('fullscreen-mode');
        isFull = false;
      }
      setTimeout(()=>{
        transitioning = false;
      },320);
    })
    // 监听ESC退出全屏，同步状态
    document.addEventListener('fullscreenchange', syncFullState);
    document.addEventListener('webkitfullscreenchange', syncFullState);
    function syncFullState(){
      if(!document.fullscreenElement && !document.webkitFullscreenElement){
        modelContainer.classList.remove('fullscreen-mode');
        isFull = false;
      }
    }

    // ========== 手势/鼠标移动 rAF 节流优化，解决移动端拖动卡顿 ==========
    let rafLock = false;
    document.addEventListener('pointermove', (e)=>{
      if(rafLock) return;
      rafLock = true;
      requestAnimationFrame(()=>{
        // 这里放你原来的鼠标/手势业务代码，不会阻塞主线程
        rafLock = false;
      })
    })

    // 其他按钮（重置、手型、截图等），你原有JS逻辑直接粘贴在这里，不会影响布局
  </script>
</body>
</html>
